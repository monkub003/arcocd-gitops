apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 1.8.2
    helm:
      values: |
        clusterName: eks-lab
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
          annotations:
            # แทนที่ <ACCOUNT_ID> ด้วยค่าจาก: terraform output lbc_role_arn
            eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/eks-lab-aws-lbc
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
